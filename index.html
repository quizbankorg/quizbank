<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get QuizBank</title>
    <meta name="description"
        content="QuizBank - Automatically load correct answers from a knowledge base built across all quizzes in all courses.">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fff;
            color: #000;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 2rem;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #000;
        }

        .cta-button {
            display: inline-block;
            margin-top: 2rem;
            padding: 0.5rem 1.5rem;
            font-size: 1rem;
            font-weight: normal;
            color: #fff;
            background: #0056b3;
            border: 2px solid #0056b3;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .cta-button:hover {
            background: #003d82;
            border-color: #003d82;
            color: #fff;
        }

        .version-info {
            margin-top: 0.5rem;
            font-size: 0.7rem;
            color: rgba(0, 0, 0, 0.6);
        }
    </style>
</head>

<body>
    <div class="container">
        <a href="https://github.com/quizbankorg/quizbank/releases/latest/download/quizbank.zip" class="cta-button">Get</a>

        <div class="version-info" id="version-info">Loading version...</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        (async () => {
            try {
                const supabaseClient = supabase.createClient(
                    'https://bgfyvqidmxjnyhsklynv.supabase.co',
                    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJnZnl2cWlkbXhqbnloc2tseW52Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTkwNzQ5NTAsImV4cCI6MjA3NDY1MDk1MH0.a7dYad377cYyaDn4nCJHUhdXMYSlQF0s-GYSELqkWTI'
                );

                const { data, error } = await supabaseClient
                    .from('app_version')
                    .select('version')
                    .order('created_at', { ascending: false })
                    .limit(1)
                    .single();

                const versionEl = document.getElementById('version-info');
                if (data && data.version) {
                    versionEl.textContent = `Latest version: ${data.version}`;
                } else {
                    versionEl.textContent = '';
                }
            } catch (e) {
                document.getElementById('version-info').textContent = '';
            }
        })();
    </script>
</body>

</html>
